name: contafacil

services:
  postgres:
    image: postgres:16-alpine
    container_name: contafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgresPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-contafacil_mx}
    # No exponer el puerto 5432 al host para evitar conflictos con otras BD del VPS
    expose:
      - "5432"
    volumes:
      - contafacil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contafacil_mx"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contafacil_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contafacil-app
    restart: unless-stopped
    # Puerto configurable (por defecto 3015) para no colisionar con el puerto 3000 de otros proyectos
    ports:
      - "${APP_PORT:-3015}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgresPassword2026!}@postgres:5432/${POSTGRES_DB:-contafacil_mx}?schema=public"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-contafacil-mexico-sat-2026-super-secret-key-32chars}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3015}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3015}"
      CERT_VAULT_KEY: "${CERT_VAULT_KEY:-contafacil-sat-aes256-gcm-vault-key-32chars!}"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contafacil_net

networks:
  contafacil_net:
    driver: bridge

volumes:
  contafacil_postgres_data:
    name: contafacil_postgres_data
