name: contafacil

services:
  postgres:
    image: postgres:16-alpine
    container_name: contafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?La variable POSTGRES_USER es obligatoria en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD es obligatoria en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-contafacil_mx}
    # No exponer el puerto 5432 al host para evitar conflictos con otras BD del VPS
    expose:
      - "5432"
    volumes:
      - contafacil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contafacil_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contafacil-app
    restart: unless-stopped
    # Puerto configurable (por defecto 3015) para no colisionar con el puerto 3000 de otros proyectos
    ports:
      - "${APP_PORT:-3015}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contafacil_mx}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?La variable NEXTAUTH_SECRET es obligatoria en el archivo .env}
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3015}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3015}"
      CERT_VAULT_KEY: ${CERT_VAULT_KEY:?La variable CERT_VAULT_KEY es obligatoria en el archivo .env}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL_INTERNAL: "http://127.0.0.1:3000"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contafacil_net

networks:
  contafacil_net:
    driver: bridge

volumes:
  contafacil_postgres_data:
    name: contafacil_postgres_data
